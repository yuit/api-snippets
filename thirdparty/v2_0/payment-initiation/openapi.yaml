openapi: 3.1.0
info:
  version: '1.0'
  title: Third-party Payment Initiation API
  description: |
    The Third-party Payment Initiation (3PPI) API allows third-party payment initiation service providers (PISP),a non-fund-holding participants, to initiate payments on behalf of their customers over a centralized Mojaloop hub.

    The API provides 2 categories of endpoints:
    1. Administration endpoints for managing how accounts are linked and credentials are established between a DFSP and a PISP 
    2. Payment initiation endpoints for managing transaction process between a PISP and a DFSP
  license:
    name: Apache License Version 2.0, January 2004
    url: http://www.apache.org/licenses/
servers:
  - url: '{protocol}://api.mojaloop.sandbox.com/v1'
    variables:
      protocol:
        enum:
          - http
          - https
        default: https
tags:
  - name: tppTransactionRequests
    x-displayName: Transaction Requests
    x-kind: sequence
    description: |
      The `/tppTransactionRequests` resources are analogous to the `/transactionRequests` resource described in fspiop API. The PISP uses it to request the owner of the PISP's customer's account to transfer a specified amount from the customer's account with the DFSP to a named Payee.
  
  - name: tppTransfers
    x-displayName: Transfers
    x-kind: sequence
    description: |
      The `/tppTransfers` resources are analogous to the `/transfers` resource described in fspiop API. The PISP uses it to request the owner of the PISP's customer's account to transfer a specified amount from the customer's account with the DFSP to a named Payee.
x-tagGroups:
  - name: Administration
    tags:
      - tppAccountRequest
      - tppAccounts
  - name: Payment Initiation
    tags:
      - tppTransactionRequests
      - tppTransfers
  - name: Monitoring
    tags:
      - health
      - metrics
paths:
  /interface:
    post:
      operationId: includeSchemaDefinitions
      summary: Include Schema Definitions needed for Typescript definition files
      description: >-
        Essential path to include schema definitions that are not used explicitly by 3PPI API endpoints.
        When bundled with openapi-cli, these definitions get included into the API definition that will be used to generate Typescript definition files. 
        This path will be stripped by the pre-doc build script (defined in the scripts/openapi-refactor.ts) when building final OpenAPI references.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '../components/schemas/ParticipantsIDPutResponse.yaml'
                - $ref: '../components/schemas/PartiesTypeIDPutResponse.yaml'
                - $ref: '../components/schemas/QuotesIDPutResponse.yaml'
                - $ref: '../components/schemas/AuthorizationResponseType.yaml'
                - $ref: '../components/schemas/ConsentStatusIssued.yaml'
                - $ref: '../components/schemas/IlpFulfilment.yaml'
                - $ref: '../components/schemas/Integer.yaml'
                - $ref: '../components/schemas/Note.yaml'
                - $ref: '../components/schemas/PartyIdInfoTPLink.yaml'
                - $ref: '../components/schemas/PartyResult.yaml'
                - $ref: '../components/schemas/ServiceType.yaml'
                - $ref: '../components/schemas/ParticipantsPostRequest.yaml'
                - $ref: '../components/schemas/QuotesPostRequest.yaml'
      responses:
        200:
          description: Ok
  /tppTransactionRequests:
    $ref: ../paths/tppTransactionRequests.yaml
  /tppTransactionRequests/{ID}:
    $ref: ../paths/tppTransactionRequests_ID.yaml
  /tppTransactionRequests/{ID}/error:
    $ref: ../paths/tppTransactionRequests_ID_error.yaml
  /tppTransfers:
    $ref: ../paths/tppTransfers.yaml
  /tppTransfers/{ID}:
    $ref: ../paths/tppTransfers_ID.yaml
  /tppTransfers/{ID}/error:
    $ref: ../paths/tppTransfers_ID_error.yaml

  # --- Monitoring Paths ---
  /health:
    $ref: ../paths/health.yaml
  /metrics:
    $ref: ../paths/metrics.yaml